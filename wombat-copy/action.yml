---
name: "Wombat Copy"
description: "Copies files via SCP or locally based on WOMBAT_GITHUB_ACTION_USE_REMOTE_SSH_DEPLOY_STRATEGY"
inputs:
  host:
    description: "SSH Host"
    required: false
  username:
    description: "SSH Username"
    required: false
  key:
    description: "SSH Private Key"
    required: false
  source:
    description: "Comma-separated source paths"
    required: true
  target:
    description: "Target directory"
    required: true
  strip_components:
    description: "Strip path components"
    required: false
    default: "0"

runs:
  using: "composite"
  steps:
    - name: Copy via SCP
      if: env.WOMBAT_GITHUB_ACTION_USE_REMOTE_SSH_DEPLOY_STRATEGY == 'true'
      shell: bash
      run: |
        # Write SSH key
        SSH_KEY_FILE=$(mktemp)
        echo "${{ inputs.key }}" > "$SSH_KEY_FILE"
        chmod 600 "$SSH_KEY_FILE"

        # Transfer files via native scp
        IFS=',' read -ra SOURCES <<< "${{ inputs.source }}"
        for src in "${SOURCES[@]}"; do
          src=$(echo "$src" | xargs)
          if [ -d "$src" ] || [ -f "$src" ]; then
            scp -o StrictHostKeyChecking=no -i "$SSH_KEY_FILE" -r "$src" "${{ inputs.username }}@${{ inputs.host }}:${{ inputs.target }}/"
          fi
        done

        # Clean up
        rm -f "$SSH_KEY_FILE"

    - name: Copy Locally
      if: env.WOMBAT_GITHUB_ACTION_USE_REMOTE_SSH_DEPLOY_STRATEGY != 'true'
      shell: bash
      run: |
        sudo mkdir -p "${{ inputs.target }}"
        IFS=',' read -ra SOURCES <<< "${{ inputs.source }}"
        for src in "${SOURCES[@]}"; do
          # Remove trailing/leading whitespace
          src=$(echo "$src" | xargs)
          if [ -d "$src" ] || [ -f "$src" ]; then
            sudo cp -r "$src" "${{ inputs.target }}/"
          else
            echo "Warning: Source $src not found"
          fi
        done
