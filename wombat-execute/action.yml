---
name: "Wombat Execute"
description: "Runs a script either via SSH or locally based on WOMBAT_GITHUB_ACTION_USE_REMOTE_SSH_DEPLOY_STRATEGY"
inputs:
  host:
    description: "SSH Host"
    required: false
  username:
    description: "SSH Username"
    required: false
  key:
    description: "SSH Private Key"
    required: false
  envs:
    description: "Environment variables to pass to the remote host"
    required: false
  script:
    description: "Script to execute"
    required: true

runs:
  using: "composite"
  steps:
    - name: Run via SSH
      if: env.WOMBAT_GITHUB_ACTION_USE_REMOTE_SSH_DEPLOY_STRATEGY == 'true'
      shell: bash
      run: |
        # Write the SSH private key safely to a temporary file
        SSH_KEY_FILE=$(mktemp)
        echo "${{ inputs.key }}" > "$SSH_KEY_FILE"
        chmod 600 "$SSH_KEY_FILE"

        # Execute the script remotely using native ssh client
        ssh -o StrictHostKeyChecking=no -i "$SSH_KEY_FILE" "${{ inputs.username }}@${{ inputs.host }}" "bash -s" << 'EOF'
        ${{ inputs.script }}
        EOF

        # Clean up key file
        rm -f "$SSH_KEY_FILE"

    - name: Run Locally
      if: env.WOMBAT_GITHUB_ACTION_USE_REMOTE_SSH_DEPLOY_STRATEGY != 'true'
      shell: bash
      run: |
        TMP_SCRIPT=$(mktemp)
        cat << 'EOF' > "$TMP_SCRIPT"
        set -x
        ${{ inputs.script }}
        EOF
        chmod +x "$TMP_SCRIPT"
        bash "$TMP_SCRIPT"
        rm -f "$TMP_SCRIPT"
